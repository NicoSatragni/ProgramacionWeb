<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compras Compartidas | Lista de Artículos</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header class="app-header">
        <div class="container">
            <h1>Compras Compartidas</h1>
            <p class="subtitle">Gestión de artículos para la convivencia</p>
        </div>
    </header>

    <main class="container main-content">
        <!-- Formulario para crear un nuevo artículo -->
        <section class="card" aria-labelledby="form-heading">
            <h2 id="form-heading">Agregar nuevo artículo</h2>
            <form id="item-form" class="item-form" novalidate>
                <div class="form-group">
                    <label for="item-title">Nombre del artículo:</label>
                    <input 
                        type="text" 
                        id="item-title" 
                        name="title" 
                        placeholder="Ej: Leche, Detergente, Yerba..." 
                        required 
                        autocomplete="off"
                    >
                </div>

                <div class="form-group">
                    <label for="item-quantity">Cantidad:</label>
                    <input 
                        type="number" 
                        id="item-quantity" 
                        name="quantity" 
                        min="1" 
                        value="1" 
                        required
                    >
                </div>

                <button type="submit" id="btn-submit" class="btn btn-primary">
                    Agregar a la lista
                </button>
            </form>
            <div id="form-feedback" class="feedback-message" role="alert" aria-live="polite"></div>
        </section>

        <!-- Lista de artículos existentes -->
        <section class="card" aria-labelledby="list-heading">
            <div class="list-header">
                <h2 id="list-heading">Artículos pendientes</h2>
                <span id="items-count" class="badge">0 artículos</span>
            </div>

            <!-- Contenedor dinámico seleccionado por JS -->
            <ul id="items-list" class="items-list" aria-live="polite">
                <!-- Se cargan con JavaScript -->
            </ul>
        </section>
    </main>

    <footer class="app-footer">
        <div class="container">
            <p>Programación Web (UNICEN) &mdash; Nicola Satragni</p>
        </div>
    </footer>
</body>
</html>
